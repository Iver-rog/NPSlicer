[package]
name = "NPSlicer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "NPSlicer"
path = "src/main.rs"

[dependencies]
npslicer_core = { path = "../core"}

iced = { version = "0.14.0", features = ["debug", "image", "advanced", "wgpu", "tokio", "markdown","sipper"] }
image = { version = "0.25", default-features = false }
bytemuck = { version = "1.0", features = ["derive"] }
glam = { version = "0.25", features = ["bytemuck"] }


rfd = "0.15.3"
tokio = { workspace = true, features = ["fs","sync"] }
stl_io = "0.8.2"
env_logger = "0.11.10"
futures-core = "0.3.32"
