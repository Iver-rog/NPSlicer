[package]
name = "NPSlicer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "NPSlicer"
path = "src/main.rs"

[dependencies]
#core = { path = "../core"}

iced = { git = "https://github.com/iced-rs/iced", features = ["debug", "image", "advanced"] }
wgpu = "24.0"
image = { version = "0.25", default-features = false }
bytemuck = { version = "1.0", features = ["derive"] }
glam = { version = "0.25", features = ["bytemuck"] }
rand = "0.8.5"
